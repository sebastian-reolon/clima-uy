[project]
name = "clima-uy"
version = "0.1.0"
description = "Public reference site about El Niño and the Uruguay River"
requires-python = ">=3.12"
dependencies = ["numpy", "jinja2", "pypdf"]

[project.optional-dependencies]
dev = ["pytest"]
mapa = ["rasterio", "shapely>=2", "pyproj"]
mapa-pack = ["clima-uy[mapa]", "scipy", "scikit-image", "osmium", "pyshp"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["climauy*"]

[tool.setuptools.package-data]
climauy = ["stations.json"]
"climauy.site" = ["static/css/*.css", "static/js/*.js", "static/fonts/*.woff2", "static/fonts/*.txt", "templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
